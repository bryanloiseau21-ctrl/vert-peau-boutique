# Compile Mon Potager pour Android.
# - À chaque modification : APK de test à installer directement sur un téléphone Android.
# - Avec les secrets de signature : produit aussi le fichier .aab à déposer sur le Google Play Console.
# Secrets de signature (optionnels) : POTAGER_ANDROID_KEYSTORE_BASE64, POTAGER_ANDROID_KEYSTORE_PASSWORD, POTAGER_ANDROID_KEY_ALIAS, POTAGER_ANDROID_KEY_PASSWORD
name: Mon Potager – Android

on:
  push:
    paths: ["mon-potager/**", ".github/workflows/potager-android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mon-potager
    env:
      HAS_KS: ${{ secrets.POTAGER_ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mon-potager/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools   # le paquet « tools » par défaut n'existe plus

      - name: Installer et tester
        run: npm ci && npm run test:logique

      - name: Synchroniser le projet Android
        run: |
          npx cap sync android
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle

      - name: APK de test
        working-directory: mon-potager/android
        run: ./gradlew assembleDebug --no-daemon

      - name: AAB signé pour le Play Store
        if: ${{ env.HAS_KS == 'true' }}
        env:
          KS: ${{ secrets.POTAGER_ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.POTAGER_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POTAGER_ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.POTAGER_ANDROID_KEY_PASSWORD }}
        working-directory: mon-potager/android
        run: |
          umask 077
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
          rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: mon-potager-android
          if-no-files-found: error
          path: |
            mon-potager/android/app/build/outputs/apk/debug/*.apk
            mon-potager/android/app/build/outputs/bundle/release/*.aab
