# Compile Boost Étudiant pour iPhone sur un Mac de GitHub et l'envoie sur App Store Connect (TestFlight).
# Lancement : onglet Actions → « Boost Étudiant – App Store » → Run workflow.
# Secrets à créer (Settings → Secrets and variables → Actions) : voir aides-etudiants/PUBLIER.md
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, GOOGLE_SERVICE_INFO_PLIST
name: Boost Étudiant – App Store

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: aides-etudiants
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aides-etudiants/package-lock.json

      - name: Vérifier les secrets
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            [ -n "${!v}" ] || { echo "::error::Secret $v manquant (voir aides-etudiants/PUBLIER.md)"; exit 1; }
          done

      - name: Installer et vérifier les données
        run: npm ci && npm run check && node scripts/vendor-firebase.js

      - name: Lieux CROUS (open data)
        run: node scripts/lieux.js || echo "::warning::Lieux CROUS indisponibles, l'onglet Autour affichera un message"

      - name: Configuration Firebase
        env:
          GSI: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          grep -q 'apiKey: "[^"]' www/firebase-config.js || { echo "::error::Remplis www/firebase-config.js (voir PUBLIER.md)"; exit 1; }
          [ -n "$GSI" ] || { echo "::error::Secret GOOGLE_SERVICE_INFO_PLIST manquant (voir PUBLIER.md)"; exit 1; }
          echo "$GSI" | base64 --decode > ios/App/App/GoogleService-Info.plist
          REV=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" ios/App/App/GoogleService-Info.plist)
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 $REV" ios/App/App/Info.plist

      - name: Synchroniser le projet iOS
        run: npx cap sync ios

      - name: Clé API App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [ -n "$ASC_KEY_P8" ] || { echo "::error::Secret ASC_KEY_P8 manquant"; exit 1; }
          mkdir -p ~/private_keys && chmod 700 ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archiver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Envoyer sur App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "✅ Build ${{ github.run_number }} envoyé. Il apparaît dans App Store Connect → TestFlight d'ici 10–30 min." >> "$GITHUB_STEP_SUMMARY"

      - name: Nettoyer la clé
        if: always()
        run: rm -rf ~/private_keys
