<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/><stop offset=".55" stop-color="#14b8a6"/><stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".38" r=".55">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="herbe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bef264"/><stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="terre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b45309"/><stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="feuilleG" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#16a34a"/><stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="feuilleD" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#15803d"/><stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <radialGradient id="soleil" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#fef9c3"/><stop offset=".6" stop-color="#fde047"/><stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#064e3b" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#fond)"/>
  <rect width="512" height="512" rx="112" fill="url(#halo)"/>
  <!-- soleil -->
  <circle cx="380" cy="118" r="44" fill="url(#soleil)"/>
  <circle cx="380" cy="118" r="62" fill="#fde047" opacity=".18"/>
  <!-- ombre au sol -->
  <ellipse cx="256" cy="452" rx="92" ry="12" fill="#064e3b" opacity=".25"/>
  <g filter="url(#ombre)">
    <!-- dessous de l'île -->
    <path d="M118 318 Q256 352 394 318 Q360 380 300 412 Q256 436 212 412 Q152 380 118 318Z" fill="url(#terre)"/>
    <path d="M160 352 Q256 372 352 352 Q330 378 296 396 Q256 410 216 396 Q182 378 160 352Z" fill="#000" opacity=".12"/>
    <!-- dessus herbeux -->
    <ellipse cx="256" cy="312" rx="140" ry="38" fill="url(#herbe)"/>
    <ellipse cx="236" cy="302" rx="90" ry="16" fill="#fff" opacity=".25"/>
    <!-- bac du potager -->
    <rect x="186" y="294" width="140" height="30" rx="12" fill="#f59e0b"/>
    <rect x="196" y="300" width="120" height="16" rx="8" fill="#78350f"/>
    <circle cx="222" cy="306" r="7" fill="#4ade80"/><circle cx="256" cy="306" r="7" fill="#4ade80"/><circle cx="290" cy="306" r="7" fill="#4ade80"/>
    <!-- pousse -->
    <path d="M256 300 C256 260 254 232 256 196" stroke="#15803d" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M254 238 C210 240 170 210 164 160 C214 156 252 188 254 238Z" fill="url(#feuilleG)"/>
    <path d="M258 214 C262 160 300 120 360 118 C360 176 318 214 258 214Z" fill="url(#feuilleD)"/>
    <path d="M250 228 C222 220 198 200 184 176" stroke="#fff" stroke-opacity=".45" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M266 204 C290 186 312 160 340 138" stroke="#fff" stroke-opacity=".45" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
  <!-- étincelles -->
  <path d="M120 140 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6Z" fill="#fff" opacity=".9"/>
  <path d="M408 236 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4Z" fill="#fff" opacity=".75"/>
</svg>
