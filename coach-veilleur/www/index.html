<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Veilleur Coach</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f1f3f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#050607" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Concept : tableau de bord de récupération — trois scores en anneaux en tête, des cartes arrondies, des chiffres serrés et lisibles ; la couleur dit l'état (vert, jaune, rouge), jamais la décoration. */
:root {
  --fond: #f1f3f6;
  --carte: #ffffff;
  --carte-2: #e9edf2;
  --trait: #dde2e9;
  --texte: #0d1117;
  --gris: #5a6472;
  --vert: #0f9d58;
  --jaune: #b98900;
  --rouge: #e0353b;
  --bleu: #1a73d9;
  --orange: #e8681a;
  --ombre: 0 1px 2px rgb(13 17 23 / 6%), 0 4px 16px rgb(13 17 23 / 5%);
  --titre: "Barlow Semi Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --corps: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --rayon: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --fond: #050607; --carte: #13171c; --carte-2: #1d232a; --trait: #262d36; --texte: #f2f4f7; --gris: #8d97a5;
  --vert: #22d36b; --jaune: #f2c230; --rouge: #ff4b55; --bleu: #3aa0ff; --orange: #ff8a3d; --ombre: none; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --fond: #050607; --carte: #13171c; --carte-2: #1d232a; --trait: #262d36; --texte: #f2f4f7; --gris: #8d97a5;
  --vert: #22d36b; --jaune: #f2c230; --rouge: #ff4b55; --bleu: #3aa0ff; --orange: #ff8a3d; --ombre: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--fond); color: var(--texte); font: 16px/1.5 var(--corps); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
#app {
  max-width: 560px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 100px);
  display: flex; flex-direction: column; gap: 16px;
}
.ecran { display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--titre); margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; line-height: 1.05; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.2rem; font-weight: 700; }
h3 { font-size: 1.02rem; font-weight: 600; font-family: var(--corps); }
p { margin: 0; }
.etiquette { font: 600 .74rem/1.2 var(--titre); letter-spacing: .12em; text-transform: uppercase; color: var(--gris); }
.muet { color: var(--gris); }
.num { font-family: var(--titre); font-variant-numeric: tabular-nums; }

.entete { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.marque { display: flex; align-items: center; gap: 9px; font: 700 1.05rem/1 var(--titre); letter-spacing: .24em; text-transform: uppercase; }
.marque svg { width: 26px; height: 26px; }
.statut { font: 500 .9rem/1 var(--corps); color: var(--gris); text-transform: capitalize; }

.plaque { background: var(--carte); border: 1px solid var(--trait); border-radius: var(--rayon); box-shadow: var(--ombre); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.coach { background: var(--carte); }
.coach .voix { font-size: 1.08rem; line-height: 1.45; font-weight: 500; }
.coach .etiquette { color: var(--bleu); }

.btn {
  appearance: none; border: 0; cursor: pointer; border-radius: 999px; width: 100%;
  font: 700 1rem/1 var(--titre); letter-spacing: .08em; text-transform: uppercase;
  padding: 17px 22px; color: var(--fond); background: var(--texte); transition: transform .12s, opacity .12s;
}
.btn:active { transform: scale(.985); opacity: .9; }
.btn.second { background: var(--carte); color: var(--texte); box-shadow: inset 0 0 0 1px var(--trait); }
.btn.petit { width: auto; padding: 11px 16px; font-size: .8rem; }
.btn.danger { background: var(--rouge); color: #fff; }
.btn:focus-visible, .puce:focus-visible, .onglet:focus-visible, input:focus-visible, label.btn:focus-visible, summary:focus-visible { outline: 2px solid var(--bleu); outline-offset: 3px; }
label.btn { display: block; text-align: center; }
.rangee-btn { display: flex; gap: 10px; }
.rangee-btn > * { flex: 1; min-width: 0; }

.champ { display: flex; flex-direction: column; gap: 9px; }
.puces { display: flex; flex-wrap: wrap; gap: 8px; }
.puce { appearance: none; cursor: pointer; border: 1px solid var(--trait); background: var(--carte-2); color: var(--texte); border-radius: 999px; font: 500 .95rem/1 var(--corps); padding: 11px 15px; min-height: 42px; }
.puce[aria-pressed="true"] { background: var(--texte); color: var(--fond); border-color: var(--texte); font-weight: 600; }
.echelle { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.echelle .puce { padding: 12px 0; text-align: center; font-family: var(--titre); font-weight: 700; border-radius: 12px; }
.echelle-legende { display: flex; justify-content: space-between; font-size: .8rem; color: var(--gris); }
input[type="text"], input[type="number"], input[type="password"] {
  width: 100%; min-width: 0; font: 500 1.05rem var(--corps); color: var(--texte); background: var(--carte-2);
  border: 1px solid var(--trait); border-radius: 12px; padding: 14px;
}
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.trio .champ { min-width: 0; }

/* Scores en anneaux */
.scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.score { appearance: none; border: 0; background: none; color: inherit; cursor: pointer; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font: inherit; }
.score svg { width: 100%; max-width: 116px; aspect-ratio: 1; }
.score .etiquette { text-align: center; }
.anneau-texte { font-family: var(--titre); font-weight: 700; fill: var(--texte); }
.anneau-sous { font: 600 9px var(--titre); letter-spacing: .12em; fill: var(--gris); }
.etat { display: inline-flex; align-items: center; gap: 7px; font: 700 .8rem/1 var(--titre); letter-spacing: .1em; text-transform: uppercase; }
.etat::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.etat.vert { color: var(--vert); } .etat.jaune { color: var(--jaune); } .etat.rouge { color: var(--rouge); }

details.explication { border-top: 1px solid var(--trait); padding-top: 10px; }
details.explication summary { cursor: pointer; list-style: none; font: 600 .9rem/1.3 var(--corps); color: var(--bleu); }
details.explication summary::-webkit-details-marker { display: none; }
details.explication summary::after { content: " +"; }
details.explication[open] summary::after { content: " −"; }
details.explication p, details.explication ul { margin-top: 8px; font-size: .93rem; color: var(--gris); }
details.explication ul { padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }

.semaine { display: flex; align-items: center; gap: 16px; }
.jauge { display: flex; gap: 5px; flex: 1; }
.jauge span { flex: 1; height: 8px; border-radius: 4px; background: var(--carte-2); }
.jauge span.on { background: var(--bleu); }
.grand-chiffre { font: 700 2.2rem/1 var(--titre); font-variant-numeric: tabular-nums; }
.grand-chiffre small { font-size: .9rem; color: var(--gris); font-weight: 500; }

.liste { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--trait); min-width: 0; }
.item:first-child { border-top: 0; padding-top: 0; }
.item .corps-item { flex: 1; min-width: 0; }
.item .corps-item h3 { overflow-wrap: anywhere; }
.code { font: 700 .8rem/1 var(--titre); color: var(--gris); min-width: 24px; }
.dosage { font: 700 1rem/1.2 var(--titre); white-space: nowrap; font-variant-numeric: tabular-nums; }
.raisons { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
.raisons li { display: flex; gap: 10px; font-size: .95rem; }
.raisons li::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; margin-top: .55em; background: var(--bleu); }

.hud { text-align: center; align-items: center; gap: 10px; }
.cible { font: 700 clamp(4.5rem, 24vw, 7rem)/.9 var(--titre); font-variant-numeric: tabular-nums; color: var(--texte); }
.unite { font: 600 .85rem/1 var(--titre); letter-spacing: .16em; text-transform: uppercase; color: var(--gris); }
.reglage { display: flex; align-items: center; justify-content: center; gap: 18px; }
.rond { appearance: none; cursor: pointer; width: 54px; height: 54px; border-radius: 50%; border: 1px solid var(--trait); background: var(--carte-2); color: var(--texte); font: 700 1.5rem/1 var(--titre); }
.rond.mini { width: 36px; height: 36px; font-size: 1.1rem; flex: none; }
.barre { height: 6px; border-radius: 3px; background: var(--carte-2); position: relative; overflow: hidden; width: 100%; }
.barre i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--bleu); transition: width .3s; }
.anneau { width: 190px; max-width: 100%; aspect-ratio: 1; }

.charge-machine { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; padding-bottom: 12px; border-bottom: 1px solid var(--trait); }
.changements { display: flex; flex-direction: column; gap: 8px; }
.chgt { display: flex; gap: 10px; align-items: baseline; font-size: .97rem; }
.chgt b { font-family: var(--titre); width: 18px; flex: none; text-align: center; }
.chgt.monte b, .chgt.plus b { color: var(--vert); }
.chgt.descend b, .chgt.moins b { color: var(--rouge); }
.chgt.max b { color: var(--jaune); }

.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { background: var(--carte); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.stat .num { font-size: 1.8rem; font-weight: 700; line-height: 1; }
svg text { fill: var(--gris); font: 600 10px var(--titre); }
.niveau { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--trait); }
.niveau:first-of-type { border-top: 0; }
.crans { grid-column: 1 / -1; display: flex; gap: 3px; }
.crans span { flex: 1; height: 5px; border-radius: 3px; background: var(--carte-2); }
.crans span.on { background: var(--vert); }

.equation { display: flex; align-items: flex-start; justify-content: center; gap: 14px; font-size: 1.3rem; font-weight: 700; }
.equation span { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.equation small { font: 600 .66rem/1 var(--titre); letter-spacing: .12em; text-transform: uppercase; color: var(--gris); }
.equation b { color: var(--gris); font-weight: 500; }
.macro { display: flex; flex-direction: column; gap: 7px; }
.macro-tete { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.macro.p .barre i { background: var(--rouge); } .macro.g .barre i { background: var(--jaune); } .macro.l .barre i { background: var(--bleu); }
.groupe-repas { display: flex; flex-direction: column; gap: 4px; padding-top: 10px; }
.groupe-repas + .groupe-repas { border-top: 1px solid var(--trait); }
.groupe-repas .item:first-of-type { border-top: 0; }
.quantite { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.quantite .num { min-width: 52px; text-align: center; font-size: .9rem; }
.photo-repas { width: 100%; max-height: 260px; object-fit: cover; border-radius: var(--rayon); }
.pastille { font: 700 .72rem/1 var(--titre); letter-spacing: .08em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; background: var(--carte-2); white-space: nowrap; }
.pastille.haute { color: var(--vert); } .pastille.moyenne { color: var(--jaune); } .pastille.basse { color: var(--rouge); }
.lien { appearance: none; background: none; border: 0; padding: 0; color: var(--bleu); font: inherit; text-decoration: underline; cursor: pointer; }
.choix-aliment { appearance: none; width: 100%; background: none; border: 0; border-top: 1px solid var(--trait); color: inherit; text-align: left; font: inherit; cursor: pointer; }
.choix-aliment:first-child { border-top: 0; }
.scan { width: 100%; height: 6px; border-radius: 3px; background: var(--carte-2); position: relative; overflow: hidden; }
.scan i { position: absolute; top: 0; bottom: 0; width: 35%; border-radius: 3px; background: var(--orange); animation: balaye 1.4s ease-in-out infinite alternate; }
@keyframes balaye { from { left: 0; } to { left: 65%; } }

.coche { appearance: none; flex: none; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--trait); background: none; color: var(--fond); font: 700 1rem/1 var(--titre); cursor: pointer; }
.coche.on { background: var(--vert); border-color: var(--vert); }
.interrupteur { appearance: none; width: 50px; height: 30px; border-radius: 999px; border: 0; background: var(--carte-2); position: relative; cursor: pointer; box-shadow: inset 0 0 0 1px var(--trait); }
.interrupteur i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--gris); transition: left .15s; }
.interrupteur[aria-pressed="true"] { background: var(--vert); box-shadow: none; }
.interrupteur[aria-pressed="true"] i { left: 23px; background: #fff; }
.complement { align-items: flex-start; }
input[type="time"] { width: 100%; min-width: 0; font: 500 1rem var(--corps); color: var(--texte); background: var(--carte-2); border: 1px solid var(--trait); border-radius: 12px; padding: 11px; }
.coche:focus-visible, .interrupteur:focus-visible, .lien:focus-visible { outline: 2px solid var(--bleu); outline-offset: 3px; }
nav.bas {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: color-mix(in srgb, var(--carte) 94%, transparent); backdrop-filter: blur(12px);
  border-top: 1px solid var(--trait);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
nav.bas .interieur { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.onglet { appearance: none; border: 0; background: none; color: var(--gris); cursor: pointer; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 600 .72rem/1 var(--titre); letter-spacing: .08em; text-transform: uppercase; }
.onglet svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.onglet[aria-current="page"] { color: var(--texte); }

.intro { padding-top: 5vh; gap: 20px; }
.intro .visiere { width: 64px; height: 64px; }
.pitch { font-size: 1.08rem; color: var(--gris); max-width: 36ch; }
.etapes-intro { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
.etapes-intro li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.etapes-intro b { font: 700 1.1rem/1.3 var(--titre); color: var(--bleu); }
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--texte); color: var(--fond); font: 600 .92rem var(--corps); padding: 11px 18px; border-radius: 999px; z-index: 9; max-width: calc(100% - 32px); text-align: center; }
@keyframes allume { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.ecran > * { animation: allume .3s ease-out both; }
@media (prefers-reduced-motion: reduce) { .ecran > * { animation: none; } .barre i { transition: none; } .scan i { animation: none; left: 32%; } }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
