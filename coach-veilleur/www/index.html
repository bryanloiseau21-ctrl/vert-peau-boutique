<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Veilleur Coach</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#07090c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Concept : visière de veille nocturne — un seul écran sombre, des plaques d'acier aux coins taillés, et le jaune du signal réservé à l'action. */
:root {
  --nuit: #07090c;
  --acier: #0f141b;
  --acier-2: #161d27;
  --trait: #243041;
  --texte: #e4e9f0;
  --gris: #8a96a7;
  --signal: #f5c400;
  --signal-encre: #0b0b08;
  --ok: #46d99a;
  --alerte: #ff6b5e;
  --titre: "Chakra Petch", "Rajdhani", "Segoe UI", system-ui, sans-serif;
  --corps: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --coin: 12px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--nuit);
  background-image: radial-gradient(120% 60% at 50% -10%, color-mix(in srgb, var(--signal) 9%, transparent), transparent 60%);
  background-attachment: fixed;
  color: var(--texte);
  font: 16px/1.5 var(--corps);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
#app {
  max-width: 560px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 96px);
  display: flex; flex-direction: column; gap: 18px;
}
h1, h2, h3 { font-family: var(--titre); margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 2rem; line-height: 1.05; font-weight: 700; text-transform: uppercase; }
h2 { font-size: 1.15rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
.etiquette { font: 600 .72rem/1 var(--titre); letter-spacing: .16em; text-transform: uppercase; color: var(--gris); }
.muet { color: var(--gris); }
.num { font-family: var(--titre); font-variant-numeric: tabular-nums; }

.entete { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ecran { display: flex; flex-direction: column; gap: 18px; }
.marque { display: flex; align-items: center; gap: 10px; font: 700 1.05rem/1 var(--titre); letter-spacing: .22em; text-transform: uppercase; }
.marque svg { width: 30px; height: 30px; }
.statut { font: 600 .7rem/1 var(--titre); letter-spacing: .14em; color: var(--ok); display: flex; align-items: center; gap: 6px; text-transform: uppercase; }
.statut::before { content: ""; width: 7px; height: 7px; background: var(--ok); border-radius: 50%; box-shadow: 0 0 8px var(--ok); }

.plaque {
  background: var(--acier); border: 1px solid var(--trait); padding: 18px;
  clip-path: polygon(0 0, calc(100% - var(--coin)) 0, 100% var(--coin), 100% 100%, var(--coin) 100%, 0 calc(100% - var(--coin)));
  display: flex; flex-direction: column; gap: 14px; min-width: 0;
}
.coach { border-color: color-mix(in srgb, var(--signal) 45%, var(--trait)); background: linear-gradient(160deg, color-mix(in srgb, var(--signal) 7%, var(--acier)), var(--acier) 55%); }
.coach .ligne-coach { display: flex; gap: 12px; align-items: flex-start; }
.coach .voix { font-size: 1.12rem; line-height: 1.4; font-weight: 500; }
.coach .voix::before { content: "› "; color: var(--signal); font-family: var(--titre); }

.btn {
  appearance: none; border: 0; cursor: pointer; font: 700 1rem/1 var(--titre); letter-spacing: .1em; text-transform: uppercase;
  padding: 17px 20px; width: 100%; color: var(--signal-encre); background: var(--signal);
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
  transition: transform .12s, filter .12s;
}
.btn:active { transform: scale(.985); filter: brightness(.92); }
.btn.second { background: var(--acier-2); color: var(--texte); box-shadow: inset 0 0 0 1px var(--trait); }
.btn.petit { width: auto; padding: 10px 14px; font-size: .78rem; }
.btn.danger { background: var(--alerte); color: var(--signal-encre); }
.btn:focus-visible, .puce:focus-visible, .onglet:focus-visible, input:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
.rangee-btn { display: flex; gap: 10px; }
.rangee-btn > * { flex: 1; }

.champ { display: flex; flex-direction: column; gap: 9px; }
.puces { display: flex; flex-wrap: wrap; gap: 8px; }
.puce {
  appearance: none; cursor: pointer; border: 1px solid var(--trait); background: var(--acier-2); color: var(--texte);
  font: 500 .95rem/1 var(--corps); padding: 11px 14px; min-height: 42px;
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
}
.puce[aria-pressed="true"] { background: var(--signal); color: var(--signal-encre); border-color: var(--signal); font-weight: 600; }
.echelle { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.echelle .puce { padding: 12px 0; text-align: center; font-family: var(--titre); font-weight: 600; }
.echelle-legende { display: flex; justify-content: space-between; font-size: .78rem; color: var(--gris); }
input[type="text"] {
  width: 100%; font: 500 1.05rem var(--corps); color: var(--texte); background: var(--acier-2);
  border: 1px solid var(--trait); padding: 14px; border-radius: 0;
}

.semaine { display: flex; align-items: center; gap: 16px; }
.jauge { display: flex; gap: 5px; flex: 1; }
.jauge span { flex: 1; height: 10px; background: var(--acier-2); box-shadow: inset 0 0 0 1px var(--trait); transform: skewX(-20deg); }
.jauge span.on { background: var(--signal); box-shadow: 0 0 10px color-mix(in srgb, var(--signal) 50%, transparent); }
.grand-chiffre { font: 700 2.2rem/1 var(--titre); font-variant-numeric: tabular-nums; }
.grand-chiffre small { font-size: .9rem; color: var(--gris); font-weight: 500; }

.liste { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--trait); min-width: 0; }
.item:first-child { border-top: 0; padding-top: 0; }
.item .corps-item { flex: 1; min-width: 0; }
.item .corps-item h3 { overflow-wrap: anywhere; }
.code { font: 600 .72rem/1 var(--titre); color: var(--signal); letter-spacing: .1em; min-width: 30px; }
.dosage { font: 600 .95rem/1.2 var(--titre); color: var(--texte); white-space: nowrap; font-variant-numeric: tabular-nums; }
.raisons { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.raisons li { display: flex; gap: 10px; font-size: .95rem; }
.raisons li::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: .55em; background: var(--signal); transform: rotate(45deg); }

.hud { text-align: center; align-items: center; gap: 10px; }
.cible { font: 700 clamp(4.5rem, 24vw, 7rem)/.9 var(--titre); font-variant-numeric: tabular-nums; color: var(--signal); text-shadow: 0 0 30px color-mix(in srgb, var(--signal) 35%, transparent); }
.unite { font: 600 .9rem/1 var(--titre); letter-spacing: .2em; text-transform: uppercase; color: var(--gris); }
.reglage { display: flex; align-items: center; justify-content: center; gap: 18px; }
.rond { appearance: none; cursor: pointer; width: 54px; height: 54px; border: 1px solid var(--trait); background: var(--acier-2); color: var(--texte); font: 700 1.5rem/1 var(--titre); clip-path: polygon(30% 0, 100% 0, 100% 70%, 70% 100%, 0 100%, 0 30%); }
.barre { height: 4px; background: var(--acier-2); position: relative; overflow: hidden; }
.barre i { position: absolute; inset: 0 auto 0 0; background: var(--signal); transition: width .3s; }
.anneau { width: 190px; max-width: 100%; aspect-ratio: 1; }

.changements { display: flex; flex-direction: column; gap: 8px; }
.chgt { display: flex; gap: 10px; align-items: baseline; font-size: .97rem; }
.chgt b { font-family: var(--titre); width: 18px; flex: none; text-align: center; }
.chgt.monte b, .chgt.plus b { color: var(--ok); }
.chgt.descend b, .chgt.moins b { color: var(--alerte); }
.chgt.max b { color: var(--signal); }

.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { background: var(--acier-2); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.stat .num { font-size: 1.7rem; font-weight: 700; line-height: 1; }
svg text { fill: var(--gris); font: 600 10px var(--titre); }
.niveau { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--trait); }
.niveau:first-child { border-top: 0; }
.crans { grid-column: 1 / -1; display: flex; gap: 3px; }
.crans span { flex: 1; height: 5px; background: var(--acier-2); }
.crans span.on { background: var(--signal); }

nav.bas {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: color-mix(in srgb, var(--nuit) 92%, transparent); backdrop-filter: blur(10px);
  border-top: 1px solid var(--trait);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
nav.bas .interieur { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.onglet { appearance: none; border: 0; background: none; color: var(--gris); cursor: pointer; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 5px; font: 600 .7rem/1 var(--titre); letter-spacing: .14em; text-transform: uppercase; }
.onglet svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.onglet[aria-current="page"] { color: var(--signal); }

.intro { padding-top: 6vh; gap: 22px; }
.intro .visiere { width: 120px; height: 120px; }
.pitch { font-size: 1.08rem; color: var(--gris); max-width: 34ch; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--signal); color: var(--signal-encre); font: 600 .9rem var(--titre); padding: 10px 16px; z-index: 9; max-width: calc(100% - 32px); }
@keyframes allume { from { opacity: .35; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.ecran > * { animation: allume .35s ease-out both; }
.ecran > *:nth-child(2) { animation-delay: .04s; } .ecran > *:nth-child(3) { animation-delay: .08s; } .ecran > *:nth-child(4) { animation-delay: .12s; }
@media (prefers-reduced-motion: reduce) { .ecran > * { animation: none; } .barre i { transition: none; } }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
