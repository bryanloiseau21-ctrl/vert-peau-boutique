<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c4dff"/><stop offset=".55" stop-color="#b44dea"/><stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <radialGradient id="piece" cx=".38" cy=".32" r=".8">
      <stop offset="0" stop-color="#e6ff8a"/><stop offset=".6" stop-color="#c6ff3d"/><stop offset="1" stop-color="#94d400"/>
    </radialGradient>
    <filter id="ombre" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#2a0a5e" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#fond)"/>
  <circle cx="830" cy="200" r="260" fill="#fff" opacity=".08"/>
  <circle cx="160" cy="900" r="220" fill="#fff" opacity=".06"/>
